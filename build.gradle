plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'com.github.johnrengelman.shadow' version "${shadow_version}" apply false
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    if (project.name == 'common') {
        return
    }

    // Loom selects its dependency handlers when the plugin is applied.
    if (project.name == 'neoforge') {
        project.extensions.extraProperties.set('loom.platform', 'neoforge')
    } else {
        project.extensions.extraProperties.set('loom.platform', 'fabric')
    }

    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'com.github.johnrengelman.shadow'

    base {
        archivesName = "${mod_id}-${project.name}"
    }
    version = mod_version
    group = maven_group

    repositories {
        maven { name = 'Nucleoid'; url = 'https://maven.nucleoid.xyz/'; content { includeGroup 'eu.pb4' } }
        maven { name = 'Envyware'; url = 'https://maven.envyware.co.uk/releases/'; content { includeGroup 'com.envyful.papi' } }
        mavenCentral()
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
        maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
        maven { name = 'Cobblemon'; url = 'https://maven.impactdev.net/repository/development/' }
        maven { name = 'Sonatype'; url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
        options.compilerArgs << '-Xlint:all,-processing,-serial'
    }
}
