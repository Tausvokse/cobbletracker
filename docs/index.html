<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CobbleTracker Wiki</title>
<meta name="description" content="Full documentation for CobbleTracker — a Cobblemon companion mod for spawn tracking, legendary direction, announcements and history.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E🛰️%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1017; --panel:#161826; --panel2:#1c1f30; --line:#282c42;
  --text:#e6e8f0; --muted:#9aa0b8; --dim:#6f7590;
  --accent:#7c6cf0; --accent2:#38bdf8; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --code-bg:#12141f; --radius:10px;
  --sidebar:280px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f7f8fc; --panel:#ffffff; --panel2:#f0f2f8; --line:#dfe3ef;
    --text:#1a1c26; --muted:#5a6076; --dim:#828aa3;
    --code-bg:#f2f4fa;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1017; --panel:#161826; --panel2:#1c1f30; --line:#282c42;
  --text:#e6e8f0; --muted:#9aa0b8; --dim:#6f7590; --code-bg:#12141f;
}
:root[data-theme="light"]{
  --bg:#f7f8fc; --panel:#ffffff; --panel2:#f0f2f8; --line:#dfe3ef;
  --text:#1a1c26; --muted:#5a6076; --dim:#828aa3; --code-bg:#f2f4fa;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
a{color:var(--accent2); text-decoration:none}
a:hover{text-decoration:underline}

/* ---- layout ---- */
.wrap{display:flex; min-height:100vh}
aside{
  width:var(--sidebar); flex:0 0 var(--sidebar); background:var(--panel);
  border-right:1px solid var(--line); position:sticky; top:0; height:100vh;
  overflow-y:auto; padding:18px 0 40px;
}
main{flex:1; min-width:0; padding:34px 40px 90px; max-width:960px}
@media (max-width:900px){
  aside{position:fixed; left:0; top:0; z-index:50; transform:translateX(-100%); transition:transform .2s}
  aside.open{transform:none; box-shadow:0 0 40px rgba(0,0,0,.5)}
  main{padding:70px 18px 60px}
  .menu-btn{display:flex !important}
}

/* ---- sidebar ---- */
.brand{padding:0 20px 14px; display:flex; align-items:center; gap:10px}
.brand h1{font-size:17px; margin:0; letter-spacing:-.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.brand small{display:block; color:var(--dim); font-weight:400; font-size:11.5px; letter-spacing:.3px}
.tools{padding:0 16px 14px; display:flex; gap:8px}
.langs{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.langs button{
  background:none;border:0;color:var(--muted);padding:6px 12px;cursor:pointer;
  font:600 12px/1 inherit; letter-spacing:.4px
}
.langs button[aria-pressed="true"]{background:var(--accent); color:#fff}
#search{
  flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:7px 10px; font:13px inherit; min-width:0
}
#search:focus{outline:none;border-color:var(--accent)}
nav{padding:0 10px}
nav .grp{
  color:var(--dim); font:600 10.5px/1 inherit; letter-spacing:.9px; text-transform:uppercase;
  padding:16px 10px 7px
}
nav a{
  display:block; padding:6px 10px; border-radius:7px; color:var(--muted);
  font-size:13.5px; text-decoration:none
}
nav a:hover{background:var(--panel2); color:var(--text); text-decoration:none}
nav a.active{background:var(--accent); color:#fff}
nav a.hidden{display:none}
.menu-btn{
  display:none; position:fixed; top:12px; left:12px; z-index:60;
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  width:38px;height:38px;border-radius:9px; cursor:pointer; align-items:center; justify-content:center
}

/* ---- content ---- */
section{display:none; animation:fade .18s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:27px; margin:0 0 6px; letter-spacing:-.4px}
h3{font-size:18px; margin:34px 0 8px; letter-spacing:-.2px; scroll-margin-top:20px}
h4{font-size:14.5px; margin:22px 0 6px; color:var(--text)}
.lede{color:var(--muted); font-size:16px; margin:0 0 26px}
p{margin:0 0 13px}
ul,ol{margin:0 0 13px; padding-left:22px}
li{margin:5px 0}
code{
  background:var(--code-bg); border:1px solid var(--line); border-radius:5px;
  padding:1.5px 5px; font:13px ui-monospace,SFMono-Regular,Consolas,monospace
}
pre{
  background:var(--code-bg); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; overflow-x:auto; margin:0 0 15px; position:relative
}
pre code{background:none;border:0;padding:0; font-size:12.8px; line-height:1.6; display:block; white-space:pre}
.copy{
  position:absolute; top:8px; right:8px; background:var(--panel2); border:1px solid var(--line);
  color:var(--muted); border-radius:6px; padding:3px 9px; font:600 11px inherit; cursor:pointer; opacity:0
}
pre:hover .copy{opacity:1}
.copy:hover{color:var(--text)}
table{border-collapse:collapse; width:100%; margin:0 0 16px; font-size:13.5px; display:block; overflow-x:auto}
th,td{border:1px solid var(--line); padding:8px 11px; text-align:left; vertical-align:top}
th{background:var(--panel2); font-weight:600; white-space:nowrap}
td code{white-space:nowrap}
.note,.warn,.tip{
  border-left:3px solid var(--accent2); background:var(--panel); border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 16px; margin:0 0 16px
}
.warn{border-left-color:var(--warn)}
.tip{border-left-color:var(--good)}
.note b,.warn b,.tip b{display:block; margin-bottom:3px; font-size:13px}
.note p:last-child,.warn p:last-child,.tip p:last-child{margin-bottom:0}
hr{border:0;border-top:1px solid var(--line); margin:34px 0}
.recipe{border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0 0 16px; background:var(--panel)}
.recipe h4{margin-top:0}
.recipe .why{color:var(--muted); font-size:13.5px; margin-bottom:10px}
.pill{
  display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:20px;
  padding:2px 10px; font-size:11.5px; color:var(--muted); margin:0 5px 5px 0
}
footer{color:var(--dim); font-size:12.5px; border-top:1px solid var(--line); margin-top:50px; padding-top:18px}
.noresult{color:var(--dim); padding:10px}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
<div class="wrap">
  <aside id="aside">
    <div class="brand">
      <span class="dot"></span>
      <h1>CobbleTracker<small id="brandSub">Wiki · v1.1.0</small></h1>
    </div>
    <div class="tools">
      <div class="langs" role="group">
        <button id="btnEn" aria-pressed="true">EN</button>
        <button id="btnRu" aria-pressed="false">RU</button>
      </div>
      <input id="search" type="search" placeholder="Search…" autocomplete="off" aria-label="Search documentation">
    </div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<script src="content-en.js"></script>
<script src="content-ru.js"></script>
<script>
(function(){
  var lang = localStorage.getItem('ct-lang') || ((navigator.language||'').toLowerCase().startsWith('ru') ? 'ru' : 'en');
  if (!WIKI[lang]) lang = 'en';

  var nav = document.getElementById('nav');
  var main = document.getElementById('main');
  var search = document.getElementById('search');

  function render(){
    var data = WIKI[lang];
    document.documentElement.lang = lang;
    document.getElementById('brandSub').textContent = data.subtitle;
    search.placeholder = data.searchPlaceholder;
    document.getElementById('btnEn').setAttribute('aria-pressed', lang==='en');
    document.getElementById('btnRu').setAttribute('aria-pressed', lang==='ru');

    nav.innerHTML = '';
    main.innerHTML = '';
    var lastGroup = null;
    data.sections.forEach(function(s, i){
      if (s.group && s.group !== lastGroup){
        var g = document.createElement('div');
        g.className = 'grp'; g.textContent = s.group;
        nav.appendChild(g); lastGroup = s.group;
      }
      var a = document.createElement('a');
      a.href = '#' + s.id; a.textContent = s.title; a.dataset.id = s.id;
      nav.appendChild(a);

      var sec = document.createElement('section');
      sec.id = s.id;
      sec.innerHTML = '<h2>' + s.title + '</h2>' +
                      (s.lede ? '<p class="lede">' + s.lede + '</p>' : '') + s.body;
      main.appendChild(sec);
    });
    addCopyButtons();
    show(location.hash.slice(1) || data.sections[0].id);
    filter(search.value);
  }

  function show(id){
    var data = WIKI[lang];
    if (!data.sections.some(function(s){return s.id===id;})) id = data.sections[0].id;
    [].forEach.call(main.children, function(sec){ sec.classList.toggle('on', sec.id === id); });
    [].forEach.call(nav.querySelectorAll('a'), function(a){ a.classList.toggle('active', a.dataset.id === id); });
    document.getElementById('aside').classList.remove('open');
    window.scrollTo(0,0);
  }

  function addCopyButtons(){
    [].forEach.call(main.querySelectorAll('pre'), function(pre){
      var b = document.createElement('button');
      b.className='copy'; b.type='button'; b.textContent = WIKI[lang].copy;
      b.onclick = function(){
        navigator.clipboard.writeText(pre.querySelector('code').textContent);
        b.textContent = WIKI[lang].copied;
        setTimeout(function(){ b.textContent = WIKI[lang].copy; }, 1200);
      };
      pre.appendChild(b);
    });
  }

  function filter(q){
    q = (q||'').trim().toLowerCase();
    var any = false;
    WIKI[lang].sections.forEach(function(s){
      var a = nav.querySelector('a[data-id="'+s.id+'"]');
      if (!a) return;
      var hay = (s.title + ' ' + (s.lede||'') + ' ' + s.body).toLowerCase();
      var hit = !q || hay.indexOf(q) !== -1;
      a.classList.toggle('hidden', !hit);
      if (hit) any = true;
    });
    var nr = nav.querySelector('.noresult');
    if (!any && !nr){
      nr = document.createElement('div'); nr.className='noresult';
      nr.textContent = WIKI[lang].noResults; nav.appendChild(nr);
    } else if (any && nr) nr.remove();
  }

  document.getElementById('btnEn').onclick = function(){ lang='en'; localStorage.setItem('ct-lang','en'); render(); };
  document.getElementById('btnRu').onclick = function(){ lang='ru'; localStorage.setItem('ct-lang','ru'); render(); };
  document.getElementById('menuBtn').onclick = function(){ document.getElementById('aside').classList.toggle('open'); };
  search.addEventListener('input', function(){ filter(this.value); });
  window.addEventListener('hashchange', function(){ show(location.hash.slice(1)); });

  render();
})();
</script>
</body>
</html>
