# ============================================================================
#  CobbleTracker - announcements.yml
#  How each category's spawn is announced. Keys match the category ids in
#  config.yml (legendaries, shinies, bosses, ultrabeasts, ...).
#
#  Text is MiniMessage: <gold>, <bold>, <#RRGGBB>, <gradient:#a:#b>...</gradient>.
#  Legacy &-codes (&6&l) work too. Placeholders:
#    %species% %biome% %world% %x% %y% %z%
#    %location%  -> optional whole " at coordinates" chat fragment.
#    %waypoint%  -> optional copy-coordinate link. Chat locations are hidden
#                   unless general-settings.show-spawn-location-in-chat is true.
#                   Minimap points appear automatically and need no chat click.
#
#  title / subtitle only show if general-settings.show-title is true in
#  config.yml. By default spawns are chat-only.
#
#  actionbar      a line above the hotbar; "" = none. Independent of show-title,
#                 so it's the quiet option: a cue with no chat line and no title
#                 card. It can't be clicked, so %waypoint% appears there as
#                 plain coordinates.
#  sound          sound id, or "" for none
#  sound-volume   playback volume (1.0 = normal)
#  sound-pitch    playback pitch  (1.0 = normal)
#  waypoint       allow copying visible chat coordinates (true/false)
#  play-to-all    true = everyone; false = only players near the spawn
#  broadcast-radius 0 = whole server; >0 = only players within N blocks
#
#  discord-webhook   a Discord webhook url, or "" for none. Posts happen off the
#                    server thread, so a slow or unreachable Discord never costs
#                    you tick time; if it falls far behind, the oldest queued
#                    announcements are dropped and the log says so.
#                    The url is a credential - anyone holding it can post to that
#                    channel - so CobbleTracker never writes it to the log.
#                    Coordinates obey hide-exact-position exactly as chat does.
#  discord-template  the message. Plain Discord markdown (**bold**), NOT
#                    MiniMessage. Placeholders: %species% %category% %biome%
#                    %world% %x% %y% %z%. Empty = a sensible default.
# ============================================================================

notifications:
  legendaries:
    enabled: true
    title: "<gold><bold>LEGENDARY SPAWN</bold></gold>"
    subtitle: "<aqua>%species%</aqua> <white>appeared in the</white> <green>%biome%</green>!"
    chat: "<white>A wild</white> <aqua>%species%</aqua> <white>appeared in the</white> <green>%biome%</green>%location%<gray>.</gray>"
    actionbar: ""
    sound: "cobblemon:pc.on"
    sound-volume: 1.0
    sound-pitch: 1.0
    waypoint: true
    play-to-all: true
    broadcast-radius: 0
    discord-webhook: ""
    discord-template: "**A wild %species%** appeared in %biome% at %x%, %y%, %z%"

