org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Skip Loom's IDE source-jar remapping (Mercury cannot parse Cobblemon's Kotlin sources jar). This
# only affects in-IDE source navigation for dependencies, never compilation or the produced jars.
systemProp.fabric.loom.ci=true

# --- Mod identity ---
mod_id=cobbletracker
mod_name=CobbleTracker
mod_version=1.0.0
mod_description=Minimap integration (Xaero's/VoxelMap/JourneyMap), an in-world spawn beam, announcements and a browsable spawn-history GUI for Cobblemon.
mod_license=All Rights Reserved
mod_authors=Tausvokse
maven_group=com.cobbletracker

# --- Platform / toolchain ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
java_version=21
loader_version_range=[1,)

# --- Architectury cross-loader ---
architectury_api_version=13.0.8
architectury_loom_version=1.10.455
architectury_plugin_version=3.4-SNAPSHOT
shadow_version=8.1.1

# --- Fabric (versions Cobblemon 1.7.0 requires at runtime: loader >=0.17.2, api >=0.116.6) ---
fabric_loader_version=0.17.3
fabric_api_version=0.116.14+1.21.1

# --- NeoForge ---
neoforge_version=21.1.90

# --- Cobblemon (runtime dependency; maven.impactdev.net) ---
cobblemon_version=1.7.0+1.21.1-SNAPSHOT

# --- Bundled libraries (shaded + relocated into the mod jars) ---
snakeyaml_version=2.3

